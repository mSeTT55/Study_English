name: Validate English learning memory

on:
  push:
    branches: [main]
    paths:
      - 'state/sync_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate learning data
        run: python scripts/validate_data.py
      - name: Compare against verified sync manifest
        run: python scripts/reconcile_state.py
